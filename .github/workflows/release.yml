name: Release Linux bundles

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check tag version and release ancestry
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          test "${TAG_VERSION#v}" = "$(tr -d '[:space:]' < VERSION)"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build and validate Linux release bundles
        run: |
          scripts/build-release.sh --version "${GITHUB_REF_NAME#v}" --out-dir "$RUNNER_TEMP/check-now-release"
          scripts/verify-release.sh --dir "$RUNNER_TEMP/check-now-release"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "$RUNNER_TEMP/check-now-release"/*

  dispatch-pages:
    name: Dispatch Pages deployment
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Pages deployment for the validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo teelabs/check-now --ref main -f release_tag="${GITHUB_REF_NAME}"
