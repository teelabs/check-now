name: Deploy installer to Cloudflare Pages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: check-now-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and smoke-check installer
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: installer-production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag and bundles
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${RELEASE_TAG#v}" = "$(tr -d '[:space:]' < VERSION)"
          git fetch origin main --no-tags
          tag_commit=$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$tag_commit" origin/main
          mkdir -p "$RUNNER_TEMP/check-now-release"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/check-now-release"
          scripts/verify-release.sh --dir "$RUNNER_TEMP/check-now-release"

      - name: Create Pages project when needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          projects=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          if ! jq -e 'any(.result[]?; .name == "check-now")' <<<"$projects" >/dev/null; then
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"name":"check-now","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" |
              jq -e '.success == true' >/dev/null
          fi

      - name: Deploy installer to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy distribution --project-name check-now --branch main

      - name: Smoke-check public installer
        run: |
          public_installer="$RUNNER_TEMP/check-now-install.sh"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            https://check-now.pages.dev/install.sh -o "$public_installer"
          cmp distribution/install.sh "$public_installer"
