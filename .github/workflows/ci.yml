name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Run plugin and shell checks
        run: |
          make test-plugins
          sh -n install.sh check-now.sh plugins/test.sh distribution/install.sh distribution/install-rollback-test.sh scripts/build-release.sh scripts/verify-release.sh
          distribution/install-rollback-test.sh
          bash -n internal/completion/scripts/bash
          if command -v zsh >/dev/null 2>&1; then zsh -n internal/completion/scripts/zsh; fi

      - name: Build and validate Linux release bundles
        run: |
          scripts/build-release.sh --version "$(tr -d '[:space:]' < VERSION)" --out-dir "$RUNNER_TEMP/check-now-release"
          scripts/verify-release.sh --dir "$RUNNER_TEMP/check-now-release"
